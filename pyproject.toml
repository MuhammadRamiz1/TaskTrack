[project]
name = "tasktrack"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.7.0",
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]
