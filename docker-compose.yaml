
services:

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tasktrack-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasktrack-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DB_NAME: tasktrack_db
      DB_USER: tasktrack_user
      DB_PASSWORD: tasktrack_password
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: tasktrack-postgres
    ports:
      - "4000:5432"
    environment:
      POSTGRES_DB: tasktrack_db
      POSTGRES_USER: tasktrack_user
      POSTGRES_PASSWORD: tasktrack_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktrack_user -d tasktrack_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: tasktrack-redis
    ports:
      - "4001:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
