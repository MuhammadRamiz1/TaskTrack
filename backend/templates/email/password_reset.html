<!doctype html>
<html><body style="font-family:Arial,sans-serif;background:#f7f5fc;padding:24px;color:#2e2640">
<div style="max-width:520px;margin:auto;background:#fff;border-radius:12px;padding:32px;border:1px solid #e6e0f5">
<h2 style="color:#6d4fc2;margin-top:0">Reset your password</h2>
<p>Hi {{ first_name }},</p>
<p>{% if by_hr %}HR started a password reset for your account.{% else %}We received a request to reset your password.{% endif %}</p>
<p style="text-align:center;margin:28px 0"><a href="{{ link }}" style="background:#7c5cd6;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none">Choose a new password</a></p>
<p style="font-size:13px;color:#6b6280">This link can be used once and expires on {{ expires_at }}.</p>
</div></body></html>
